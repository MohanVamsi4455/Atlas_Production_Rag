# A LOCAL Elasticsearch for development and testing only. Production uses Elastic Cloud.
#
#   Start :  docker compose -f docker-compose.elastic.yml up -d
#   Check :  curl http://localhost:9200
#   Stop  :  docker compose -f docker-compose.elastic.yml down          (keeps the data)
#   Wipe  :  docker compose -f docker-compose.elastic.yml down -v       (deletes the data)
#
# Then in .env:   ELASTIC_URL=http://localhost:9200     (leave ELASTIC_API_KEY empty)
#
# SECURITY IS OFF here, so the port is published on this computer only (127.0.0.1).
# Never change the port mapping to expose it to a network.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: atlas-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - atlas-es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  atlas-es-data:
